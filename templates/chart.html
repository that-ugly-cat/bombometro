<section class="card chart-card">
  <div class="section-heading"><h3>{{ chart.title }}</h3><span class="unit">{{ chart.unit }}</span></div>
  <div class="legend">{% for line in chart.lines %}<span><i class="swatch c{{ line.color }}"></i>{{ line.label }}</span>{% endfor %}</div>
  <svg class="chart" viewBox="0 0 752 185" role="img" aria-label="{{ chart.title }}. Exact values in hourly details below.">
    <title>{{ chart.title }} · {{ chart.unit }}</title>
    {% for tick in chart.ticks %}<line class="grid-line" x1="48" x2="720" y1="{{ tick.y }}" y2="{{ tick.y }}"/><text class="axis-label" x="40" y="{{ tick.y + 4 }}" text-anchor="end">{{ tick.value }}</text>{% endfor %}
    {% for label in chart.labels %}<text class="axis-label" x="{{ label.x }}" y="179" text-anchor="middle">{{ label.text }}</text>{% endfor %}
    {% for line in chart.lines %}<g class="c{{ line.color }}">
      {% for segment in line.segments %}<polyline class="data-line" points="{{ segment }}"/>{% endfor %}
      {% for p in line.points %}<circle class="data-point" cx="{{ p.x }}" cy="{{ p.y }}" r="3"><title>{{ p.time }} · {{ line.label }}: {{ p.value|fmt }} {{ chart.unit }}</title></circle>{% endfor %}
    </g>{% endfor %}
  </svg>
  {% if chart.note %}<p class="chart-note">{{ chart.note }}</p>{% endif %}
</section>
