services:
  bombometro:
    image: "bombometro:${BOMBOMETRO_REVISION:?Set BOMBOMETRO_REVISION to the reviewed full Git commit}"
    build:
      context: .
      args:
        VCS_REF: "${BOMBOMETRO_REVISION:?Set BOMBOMETRO_REVISION}"
    container_name: bombometro
    restart: unless-stopped
    # Only the host loopback port is published. Caddy is the public entry point.
    ports:
      - "127.0.0.1:${BOMBOMETRO_PORT:-8502}:8502"
    environment:
      APP_MODE: public
      PUBLIC_HOST: "${PUBLIC_HOST:?Set PUBLIC_HOST to the public DNS hostname}"
      APP_REVISION: "${BOMBOMETRO_REVISION:?Set BOMBOMETRO_REVISION}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

# Retained from the existing deployment. Check for conflicts before installing.
# A side-by-side candidate must use `docker run`, not a second copy of this subnet.
networks:
  default:
    ipam:
      config:
        - subnet: 10.200.123.0/24
