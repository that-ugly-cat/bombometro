[project]
name = "bombometro-web"
version = "0.1.0"
description = "FastAPI and Jinja forecast explorer for Bombometro"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4",
  "requests>=2.32,<3", "astral>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
